apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: ems
  labels:
    app: chat-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.services.chat.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8005"
          env:
            - name: CHAT_DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/chat_db"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
          ports:
            - containerPort: 8005
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: ems
  labels:
    app: chat-service
spec:
  type: ClusterIP
  selector:
    app: chat-service
  ports:
    - name: http
      port: 8005
      targetPort: 8005
