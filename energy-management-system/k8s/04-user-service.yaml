apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ems
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.services.user.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8002"
          env:
            - name: USER_DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/user_db"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
            - name: DEVICE_SERVICE_URL
              value: "http://device-service:8003"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
            - name: ADMIN_DEFAULT_USER
              value: "admin"
            - name: ADMIN_DEFAULT_USER_ID
              value: "00000000-0000-0000-0000-000000000001"
          ports:
            - containerPort: 8002
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 4
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ems
  labels:
    app: user-service
spec:
  ports:
    - port: 8002
      targetPort: 8002
      name: http
  selector:
    app: user-service

