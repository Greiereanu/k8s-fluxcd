apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-service
  namespace: ems
  labels:
    app: device-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-service
  template:
    metadata:
      labels:
        app: device-service
    spec:
      containers:
        - name: device-service
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.services.device.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8003"
          env:
            - name: DEVICE_DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/device_db"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
          ports:
            - containerPort: 8003
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 4
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: device-service
  namespace: ems
  labels:
    app: device-service
spec:
  ports:
    - port: 8003
      targetPort: 8003
      name: http
  selector:
    app: device-service
