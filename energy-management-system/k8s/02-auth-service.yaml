apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ems
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.services.auth.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          env:
            - name: AUTH_DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/auth_db"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
            - name: ADMIN_DEFAULT_USER
              value: "admin"
            - name: ADMIN_DEFAULT_PASS
              value: "Admin123!"
            - name: ADMIN_DEFAULT_USER_ID
              value: "00000000-0000-0000-0000-000000000001"
          ports:
            - containerPort: 8001
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 4
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: ems
  labels:
    app: auth-service
spec:
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: auth-service
