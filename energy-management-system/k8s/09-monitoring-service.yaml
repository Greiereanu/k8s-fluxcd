apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-service
  namespace: ems
  labels:
    app: monitoring-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-service
  template:
    metadata:
      labels:
        app: monitoring-service
    spec:
      containers:
        - name: monitoring-service
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.services.monitoring.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8004"
          env:
            - name: MONITORING_DATABASE_URL
              value: "postgresql+asyncpg://postgres:postgres@postgres:5432/monitoring_db"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: DEVICE_SERVICE_URL
              value: "http://device-service:8003"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
          ports:
            - containerPort: 8004
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: ems
  labels:
    app: monitoring-service
spec:
  type: ClusterIP
  selector:
    app: monitoring-service
  ports:
    - name: http
      port: 8004
      targetPort: 8004
