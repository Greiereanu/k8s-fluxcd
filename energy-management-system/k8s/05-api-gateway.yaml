apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ems
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ems-backend:v1
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - backend.gateway.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          env:
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
            - name: USER_SERVICE_URL
              value: "http://user-service:8002"
            - name: DEVICE_SERVICE_URL
              value: "http://device-service:8003"
            - name: JWT_SECRET_KEY
              value: "super-secret-energy-management-system-key-2026"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ems
  labels:
    app: api-gateway
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: api-gateway
