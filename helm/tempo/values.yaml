# Tempo Helm Values for local k3d (Single Binary)
tempo:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
  metricsGenerator:
    enabled: true
    remoteWriteUrl: "http://kube-prometheus-stack-prometheus.monitoring:9090/api/v1/write"
    processor:
      local_blocks:
        flush_to_storage: true
        filter_server_spans: false
      service_graphs:
        max_items: 10000
      span_metrics:
        enable_target_info: true
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks

persistence:
  enabled: true
  size: 5Gi
